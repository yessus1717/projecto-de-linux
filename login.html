<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión — LinuxPath</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0A0714;
    --bg-elevated: #130D24;
    --bg-card: #1B1330;
    --border: #362A55;
    --border-soft: #241A3D;
    --text: #F3EFFF;
    --text-dim: #A99FC9;
    --text-faint: #8577A8;
    --green: #4FFFB4;
    --green-dark: #16D98A;
    --green-deep: #0E3D2C;
    --blue: #4CD8FF;
    --blue-deep: #0D3550;
    --purple: #C97BFF;
    --purple-deep: #351667;
    --red: #FF5D7A;
    --red-deep: #4A0F24;
    --radius: 14px;
    --focus-ring: 0 0 0 2px var(--bg), 0 0 0 4px var(--green);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    line-height: 1.5;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  code, .mono { font-family: 'JetBrains Mono', monospace; }
  a { color: inherit; text-decoration: none; }

  a:focus-visible, button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
    outline: none;
    box-shadow: var(--focus-ring);
    border-radius: 8px;
  }

  .icon {
    display: inline-block; flex-shrink: 0;
    stroke: currentColor; fill: none;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -3px;
  }

  /* ---- NAV (idéntica a index.html) ---- */
  .nav {
    position: sticky; top: 0; z-index: 20;
    background: rgba(10,7,20,0.88);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border-soft);
  }
  .nav-inner {
    max-width: 1080px; margin: 0 auto; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; letter-spacing: -0.2px; }
  .brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); flex-shrink: 0; }

  /* ---- AUTH LAYOUT ---- */
  .auth-main {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 48px 24px;
    position: relative;
    overflow: hidden;
  }
  .auth-main::before {
    content: '';
    position: absolute;
    top: -220px; left: 50%;
    width: 900px; height: 620px;
    transform: translateX(-50%);
    background:
      radial-gradient(circle at 30% 30%, rgba(79,255,180,0.14), transparent 60%),
      radial-gradient(circle at 70% 60%, rgba(201,123,255,0.12), transparent 55%);
    filter: blur(10px);
    pointer-events: none;
    z-index: 0;
  }

  .auth-card {
    position: relative; z-index: 1;
    width: 100%; max-width: 400px;
    background: var(--bg-card); border: 1px solid var(--border);
    border-radius: 18px; padding: 32px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.45);
  }

  .auth-head { text-align: center; margin-bottom: 24px; }
  .auth-head .kicker-dot {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--green-deep); color: var(--green);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
  }
  .auth-head h1 { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; margin-bottom: 6px; }
  .auth-head p { font-size: 13.5px; color: var(--text-dim); }

  .auth-tabs {
    display: flex; gap: 4px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 11px; padding: 4px; margin-bottom: 24px;
  }
  .auth-tab {
    flex: 1; padding: 9px 0; text-align: center;
    font-size: 13.5px; font-weight: 600; color: var(--text-dim);
    background: none; border: none; border-radius: 8px; cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .auth-tab.active { background: var(--bg-card); color: var(--text); box-shadow: 0 1px 0 var(--border); }

  form.auth-form { display: none; flex-direction: column; gap: 14px; }
  form.auth-form.active { display: flex; }

  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label { font-size: 12.5px; font-weight: 600; color: var(--text-dim); }
  .field input {
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 10px; padding: 11px 13px;
    color: var(--text); font-family: 'Inter', sans-serif; font-size: 14px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .field input::placeholder { color: var(--text-faint); }
  .field input:focus { border-color: var(--green-dark); box-shadow: 0 0 0 3px var(--green-deep); }

  .btn-primary {
    padding: 13px 22px; background: var(--green); color: #052A1C;
    border-radius: 12px; font-size: 14.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    border: none; cursor: pointer; width: 100%; margin-top: 4px;
    transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }
  .btn-primary:hover:not(:disabled) { background: #A6FFDD; transform: translateY(-1px); box-shadow: 0 8px 20px rgba(79,255,180,0.3); }
  .btn-primary:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

  .auth-msg {
    font-size: 13px; padding: 10px 13px; border-radius: 10px;
    display: none; align-items: center; gap: 8px; line-height: 1.4;
  }
  .auth-msg.show { display: flex; }
  .auth-msg.error { background: var(--red-deep); color: var(--red); border: 1px solid rgba(255,93,122,0.35); }
  .auth-msg.success { background: var(--green-deep); color: var(--green); border: 1px solid rgba(79,255,180,0.35); }

  .auth-foot {
    text-align: center; margin-top: 22px; font-size: 13px; color: var(--text-faint);
  }
  .auth-foot a { color: var(--green); font-weight: 600; }
  .auth-foot a:hover { text-decoration: underline; }

  .auth-divider {
    display: flex; align-items: center; gap: 12px;
    margin: 18px 0; font-size: 12px; color: var(--text-faint);
  }
  .auth-divider::before, .auth-divider::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .btn-google {
    width: 100%; padding: 12px 16px;
    background: var(--bg-elevated); border: 1px solid var(--border);
    border-radius: 12px; color: var(--text); font-size: 14px; font-weight: 600;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    cursor: pointer;
    opacity: 0.85;
    transition: transform 0.15s ease, border-color 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }
  .btn-google:hover:not(:disabled), .btn-google:focus-visible { opacity: 1; border-color: var(--text-faint); background: var(--bg-card); transform: translateY(-1px); }
  .btn-google:active:not(:disabled) { transform: translateY(0) scale(0.98); }
  .btn-google:disabled { opacity: 0.6; cursor: not-allowed; }

  .spinner {
    width: 15px; height: 15px; border-radius: 50%;
    border: 2px solid rgba(5,42,28,0.35); border-top-color: #052A1C;
    animation: spin 0.7s linear infinite;
    display: none;
  }
  .spinner.show { display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
  }
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a class="brand" href="index.html"><span class="dot"></span>LinuxPath</a>
  </div>
</nav>

<main class="auth-main">
  <div class="auth-card">
    <div class="auth-head">
      <div class="kicker-dot">
        <svg class="icon" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M7 9l3 3-3 3M12 15h5"/></svg>
      </div>
      <h1 id="auth-title">Bienvenido de nuevo</h1>
      <p id="auth-subtitle">Inicia sesión para seguir tu ruta de aprendizaje</p>
    </div>

    <div class="auth-tabs">
      <button type="button" class="auth-tab active" id="tab-login" onclick="switchTab('login')">Iniciar sesión</button>
      <button type="button" class="auth-tab" id="tab-signup" onclick="switchTab('signup')">Crear cuenta</button>
    </div>

    <div class="auth-msg" id="auth-msg"></div>

    <!-- Login -->
    <form class="auth-form active" id="form-login">
      <div class="field">
        <label for="login-email">Correo</label>
        <input type="email" id="login-email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="field">
        <label for="login-password">Contraseña</label>
        <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn-primary" id="login-btn">
        <span class="spinner" id="login-spinner"></span>
        <span id="login-btn-text">Iniciar sesión</span>
      </button>

      <div class="auth-divider">o continúa con</div>
      <button type="button" class="btn-google" id="google-btn-login" onclick="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 013.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continuar con Google
      </button>
    </form>

    <!-- Registro -->
    <form class="auth-form" id="form-signup">
      <div class="field">
        <label for="signup-name">Nombre de usuario</label>
        <input type="text" id="signup-name" autocomplete="nickname" placeholder="tu_usuario" minlength="3" required>
      </div>
      <div class="field">
        <label for="signup-email">Correo</label>
        <input type="email" id="signup-email" autocomplete="email" placeholder="tucorreo@ejemplo.com" required>
      </div>
      <div class="field">
        <label for="signup-password">Contraseña</label>
        <input type="password" id="signup-password" autocomplete="new-password" placeholder="Mínimo 6 caracteres" minlength="6" required>
      </div>
      <button type="submit" class="btn-primary" id="signup-btn">
        <span class="spinner" id="signup-spinner"></span>
        <span id="signup-btn-text">Crear cuenta</span>
      </button>

      <div class="auth-divider">o continúa con</div>
      <button type="button" class="btn-google" id="google-btn-signup" onclick="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 01-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/><path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.81.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 009 18z"/><path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 013.68 9c0-.6.1-1.18.29-1.72V4.95H.96A9 9 0 000 9c0 1.45.35 2.83.96 4.05l3.01-2.33z"/><path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 00.96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/></svg>
        Continuar con Google
      </button>
    </form>

    <div class="auth-foot" id="auth-foot">
      ¿No tienes cuenta? <a href="#" onclick="switchTab('signup'); return false;">Regístrate gratis</a>
    </div>
  </div>
</main>

<script type="module">
  import { supabase } from './auth.js';

  const msgBox = document.getElementById('auth-msg');
  const foot = document.getElementById('auth-foot');
  const title = document.getElementById('auth-title');
  const subtitle = document.getElementById('auth-subtitle');

  // Si ya hay sesión activa, no tiene sentido mostrar el login.
  supabase.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'index.html';
  });

  function showMsg(text, type) {
    msgBox.textContent = text;
    msgBox.className = 'auth-msg show ' + type;
  }
  function clearMsg() {
    msgBox.className = 'auth-msg';
  }

  window.switchTab = function (tab) {
    clearMsg();
    const isLogin = tab === 'login';
    document.getElementById('tab-login').classList.toggle('active', isLogin);
    document.getElementById('tab-signup').classList.toggle('active', !isLogin);
    document.getElementById('form-login').classList.toggle('active', isLogin);
    document.getElementById('form-signup').classList.toggle('active', !isLogin);
    title.textContent = isLogin ? 'Bienvenido de nuevo' : 'Crea tu cuenta';
    subtitle.textContent = isLogin
      ? 'Inicia sesión para seguir tu ruta de aprendizaje'
      : 'Empieza gratis, sin tarjeta ni instalación';
    foot.innerHTML = isLogin
      ? '¿No tienes cuenta? <a href="#" onclick="switchTab(\'signup\'); return false;">Regístrate gratis</a>'
      : '¿Ya tienes cuenta? <a href="#" onclick="switchTab(\'login\'); return false;">Inicia sesión</a>';
  };

  function setLoading(which, loading) {
    document.getElementById(which + '-btn').disabled = loading;
    document.getElementById(which + '-spinner').classList.toggle('show', loading);
    document.getElementById(which + '-btn-text').textContent = loading
      ? (which === 'login' ? 'Entrando…' : 'Creando cuenta…')
      : (which === 'login' ? 'Iniciar sesión' : 'Crear cuenta');
  }

  document.getElementById('form-login').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg();
    setLoading('login', true);

    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    setLoading('login', false);
    if (error) {
      showMsg(traducirError(error.message), 'error');
      return;
    }
    window.location.href = 'index.html';
  });

  document.getElementById('form-signup').addEventListener('submit', async (e) => {
    e.preventDefault();
    clearMsg();
    setLoading('signup', true);

    const username = document.getElementById('signup-name').value.trim();
    const email = document.getElementById('signup-email').value.trim();
    const password = document.getElementById('signup-password').value;

    const { data, error } = await supabase.auth.signUp({
      email,
      password,
      options: { data: { username, display_name: username } }
    });

    setLoading('signup', false);
    if (error) {
      showMsg(traducirError(error.message), 'error');
      return;
    }

    if (data.session) {
      window.location.href = 'index.html';
      return;
    }

    // Confirmación de correo activada en el proyecto de Supabase
    showMsg('Cuenta creada. Revisa tu correo para confirmar tu cuenta antes de iniciar sesión.', 'success');
    document.getElementById('form-signup').reset();
  });

  function traducirError(msg) {
    if (/invalid login credentials/i.test(msg)) return 'Correo o contraseña incorrectos.';
    if (/user already registered/i.test(msg)) return 'Ya existe una cuenta con ese correo.';
    if (/password should be at least/i.test(msg)) return 'La contraseña debe tener al menos 6 caracteres.';
    if (/email not confirmed/i.test(msg)) return 'Confirma tu correo antes de iniciar sesión.';
    if (/provider is not enabled/i.test(msg)) return 'El inicio de sesión con Google aún no está activado en el proyecto.';
    return msg;
  }

  window.loginWithGoogle = async function () {
    clearMsg();
    document.getElementById('google-btn-login').disabled = true;
    document.getElementById('google-btn-signup').disabled = true;

    const { error } = await supabase.auth.signInWithOAuth({
      provider: 'google',
      options: { redirectTo: window.location.origin + window.location.pathname.replace('login.html', 'index.html') }
    });

    if (error) {
      showMsg(traducirError(error.message), 'error');
      document.getElementById('google-btn-login').disabled = false;
      document.getElementById('google-btn-signup').disabled = false;
    }
    // Si no hay error, el navegador redirige a Google automáticamente.
  };
</script>

</body>
</html>
